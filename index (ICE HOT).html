<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단체 커피 주문</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:5;background:#242a31;color:#fff;padding:18px 20px}header h1{margin:0 0 5px;font-size:21px}header p{margin:0;color:#cbd0d5;font-size:13px}main{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0000000d}h2{font-size:18px;margin:0 0 14px}label{font-size:13px;font-weight:700;color:#555}input{font:inherit}.name,.custom{width:100%;padding:13px;border:1px solid #d9dde2;border-radius:10px;font-size:16px}.name{margin-top:7px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.tab,.temp{flex:0 0 auto;border:1px solid #d9dde2;background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.tab.active{background:#242a31;color:#fff}.brandline{font-size:14px;color:#666;margin:4px 0 12px}.brandline b{color:#222}.temps{display:flex;align-items:center;gap:8px;margin-bottom:14px}.temps span{font-size:14px;font-weight:700;color:#555}.temp{border-radius:10px}.temp.active[data-temp=ICE]{background:#2878d8;border-color:#2878d8;color:#fff}.temp.active[data-temp=HOT]{background:#d9534f;border-color:#d9534f;color:#fff}.menus{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.menu{border:1px solid #ddd;background:#fff;border-radius:12px;padding:14px;text-align:left;font-weight:700;cursor:pointer}.menu:hover{background:#f7f8fa}.custombox{margin-top:16px;padding-top:16px;border-top:1px solid #eee}.custombox b{display:block;font-size:14px;color:#555;margin-bottom:9px}.customrow{display:grid;grid-template-columns:1fr auto;gap:8px}.add{border:0;border-radius:10px;background:#356ae6;color:#fff;padding:0 17px;font-weight:700}.hint{font-size:12px;color:#888;margin-top:7px}.empty{text-align:center;color:#999;padding:20px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eee}.orderrow:last-child{border:0}.orderrow small{display:block;color:#777}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eef0f2;width:32px;height:32px;border-radius:8px;font-size:18px}.total{display:flex;justify-content:space-between;border-top:2px solid #222;padding-top:13px;margin-top:12px;font-size:19px;font-weight:700}.submit{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:#242a31;color:#fff;font-size:16px;font-weight:700}.status{font-size:12px;color:#16834a;margin-top:10px}.live{color:#16834a;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools button{border:0;border-radius:9px;padding:10px 14px;color:#fff;font-weight:700}.copy{background:#356ae6}.reset{background:#dc3545}button{cursor:pointer}button:disabled{background:#999!important}.tablewrap{overflow-x:auto}table{width:100%;min-width:570px;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f7f7f7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{text-align:center;background:#f7f8fa;border:1px solid #e7e9ec;border-radius:12px;padding:14px}.stat span{display:block;font-size:12px;color:#777;margin-bottom:5px}.stat strong{font-size:20px}.brandbox{border:1px solid #e7e9ec;border-radius:13px;overflow:hidden;margin-top:12px}.brandbox h3{margin:0;background:#f6f7f9;padding:12px 14px;font-size:15px;display:flex;justify-content:space-between}.brandlist{padding:4px 14px}.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.sumrow:last-child{border:0}.grand{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:2px solid #242a31;font-size:18px;font-weight:700}@media(min-width:700px){.menus{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}.temps{align-items:stretch}.temps span{align-self:center}}
</style></head><body><header><h1>☕ 단체 커피 주문</h1><p>브랜드와 ICE/HOT을 선택한 뒤 메뉴를 담아주세요.</p></header><main>
<div class="card"><label>주문자 이름</label><input id="name" class="name" placeholder="예: 홍길동"></div>
<div class="card"><h2>브랜드 및 메뉴 선택</h2><div id="tabs" class="tabs"></div><div class="brandline">선택 브랜드: <b id="brand"></b></div><div class="temps"><span>온도 선택</span><button class="temp active" data-temp="ICE">🧊 ICE</button><button class="temp" data-temp="HOT">🔥 HOT</button></div><div id="menus" class="menus"></div><div class="custombox"><b>목록에 없는 메뉴 직접 입력</b><div class="customrow"><input id="custom" class="custom" placeholder="예: 디카페인 라떼" maxlength="40"><button id="add" class="add">추가</button></div><div class="hint">현재 선택한 브랜드와 온도로 추가됩니다.</div></div></div>
<div class="card"><h2>내 주문</h2><div id="cart"></div><div class="total"><span>총 수량</span><span id="total">0잔</span></div><button id="submit" class="submit">주문 제출</button><div id="status" class="status"></div></div>
<div class="card"><h2>현재 주문 현황 <span class="live">● 실시간</span></h2><div class="tools"><button id="copy" class="copy">주문서 복사</button><button id="reset" class="reset">전체 주문 초기화</button></div><div id="orders" class="empty">불러오는 중...</div></div>
<div class="card"><h2>최종 주문 집계 <span class="live">● 실시간</span></h2><div id="stats"></div><div id="summary" class="empty">집계 중...</div></div>
</main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getFirestore,collection,addDoc,onSnapshot,getDocs,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyD-2TW5sR9qhuCgQxwf7ysFhLi1WwCPBT8",authDomain:"newjin-coffee-dashboard.firebaseapp.com",projectId:"newjin-coffee-dashboard",storageBucket:"newjin-coffee-dashboard.firebasestorage.app",messagingSenderId:"157316244820",appId:"1:157316244820:web:9ca89db007550bd274d4c1"}),db=getFirestore(app);
const BM={"컴포즈커피":["아메리카노","카페라떼","바닐라라떼","헤이즐넛라떼","카페모카","카라멜마끼아또","콜드브루","복숭아 아이스티","레몬에이드","딸기라떼"],"메가MGC커피":["아메리카노","카페라떼","바닐라라떼","헤이즐넛라떼","카페모카","카라멜마끼아또","콜드브루","복숭아 아이스티","레몬에이드","플레인 요거트 스무디"],"폴 바셋":["룽고","아메리카노","카페라떼","바닐라빈 카페라떼","카페모카","콜드브루","아이스크림 카페라떼","밀크 아이스크림","초콜릿 라떼","제주 말차 라떼"],"스타벅스":["아메리카노","카페라떼","바닐라 카페라떼","카라멜 마키아또","카페모카","콜드브루","돌체 라떼","자몽 허니 블랙 티","유자 민트 티","딸기 딜라이트 요거트 블렌디드"],"투썸플레이스":["아메리카노","카페라떼","바닐라라떼","카라멜 마키아또","카페모카","콜드브루","복숭아 아이스티","레몬에이드","스트로베리 라떼","요거트 프라페"],"텐퍼센트커피":["아메리카노","카페라떼","바닐라라떼","헤이즐넛라떼","카페모카","카라멜 마끼아또","콜드브루","복숭아 아이스티","딸기라떼","말차라떼"]};
const $=x=>document.getElementById(x);let brand=Object.keys(BM)[0],temp="ICE",cart={},latest=[];const key=(b,m,t)=>`${b}|${t}|${m}`;
function tabs(){ $("tabs").innerHTML="";Object.keys(BM).forEach(b=>{let x=document.createElement("button");x.className="tab"+(b===brand?" active":"");x.textContent=b;x.onclick=()=>{brand=b;tabs();menus()};$("tabs").append(x)});$("brand").textContent=brand}
function menus(){ $("menus").innerHTML="";BM[brand].forEach(m=>{let x=document.createElement("button");x.className="menu";x.textContent=m;x.onclick=()=>add(btoa(unescape(encodeURIComponent(key(brand,m,temp)))),brand,m,temp);$("menus").append(x)})}
function add(k,b,m,t){if(!cart[k])cart[k]={brand:b,menu:m,temp:t,qty:0};cart[k].qty++;drawCart()}
function custom(){let m=$("custom").value.trim();if(!m)return alert("메뉴명을 입력해주세요.");add(key(brand,m,temp),brand,m,temp);$("custom").value=""}
function drawCart(){let es=Object.entries(cart);$("cart").innerHTML=es.length?"":'<div class="empty">메뉴를 선택하세요.</div>';es.forEach(([k,v])=>{let r=document.createElement("div");r.className="orderrow";let l=document.createElement("div");l.innerHTML=`<b>${escapeHtml(v.temp+" "+v.menu)}</b><small>${escapeHtml(v.brand)}</small>`;let q=document.createElement("div");q.className="qty";let a=document.createElement("button");a.textContent="−";a.onclick=()=>{if(--cart[k].qty<1)delete cart[k];drawCart()};let n=document.createElement("b");n.textContent=v.qty;let z=document.createElement("button");z.textContent="+";z.onclick=()=>{cart[k].qty++;drawCart()};q.append(a,n,z);r.append(l,q);$("cart").append(r)});$("total").textContent=es.reduce((s,[,v])=>s+v.qty,0)+"잔"}
const norm=i=>({brand:i.brand||"브랜드 미지정",menu:i.menu||"메뉴 미상",temp:i.temp||"ICE",qty:Number(i.qty)||0});
async function submit(){let name=$("name").value.trim();if(!name)return alert("이름을 입력해주세요.");if(!Object.keys(cart).length)return alert("메뉴를 선택해주세요.");$("submit").disabled=true;try{await addDoc(collection(db,"orders"),{name,items:Object.values(cart),createdAt:new Date()});cart={};drawCart();$("name").value="";$("status").textContent="주문이 접수되었습니다."}catch(e){console.error(e);$("status").textContent="저장 실패: Firebase 권한을 확인해주세요."}finally{$("submit").disabled=false}}
function drawOrders(data){if(!data.length){$("orders").innerHTML='<div class="empty">아직 주문이 없습니다.</div>';return}let w=document.createElement("div");w.className="tablewrap";let t=document.createElement("table");t.innerHTML="<thead><tr><th>주문자</th><th>브랜드</th><th>주문</th><th>수량</th></tr></thead>";let b=document.createElement("tbody");data.forEach(o=>{let is=(o.items||[]).map(norm),r=document.createElement("tr"),vals=[o.name||"-",[...new Set(is.map(i=>i.brand))].join(", "),is.map(i=>`${i.temp} ${i.menu} ${i.qty}잔`).join(", "),is.reduce((s,i)=>s+i.qty,0)+"잔"];vals.forEach(v=>{let d=document.createElement("td");d.textContent=v;r.append(d)});b.append(r)});t.append(b);w.append(t);$("orders").innerHTML="";$("orders").append(w)}
function aggregate(data){let s={},total=0;data.forEach(o=>(o.items||[]).map(norm).forEach(i=>{s[i.brand]??={};let k=`${i.temp} ${i.menu}`;s[i.brand][k]=(s[i.brand][k]||0)+i.qty;total+=i.qty}));return{s,total}}
function drawSummary(data){let{s,total}=aggregate(data),bs=Object.keys(s);$("stats").innerHTML=`<div class="stats"><div class="stat"><span>주문 인원</span><strong>${data.length}명</strong></div><div class="stat"><span>주문 브랜드</span><strong>${bs.length}곳</strong></div><div class="stat"><span>총 주문 수량</span><strong>${total}잔</strong></div></div>`;if(!bs.length){$("summary").innerHTML='<div class="empty">아직 주문이 없습니다.</div>';return}$("summary").innerHTML="";bs.sort().forEach(b=>{let es=Object.entries(s[b]).sort((a,z)=>z[1]-a[1]||a[0].localeCompare(z[0])),n=es.reduce((x,[,q])=>x+q,0),box=document.createElement("div");box.className="brandbox";let h=document.createElement("h3");h.innerHTML=`<span>${escapeHtml(b)}</span><strong>${n}잔</strong>`;let list=document.createElement("div");list.className="brandlist";es.forEach(([m,q])=>{let r=document.createElement("div");r.className="sumrow";r.innerHTML=`<span>${escapeHtml(m)}</span><strong>${q}잔</strong>`;list.append(r)});box.append(h,list);$("summary").append(box)});let g=document.createElement("div");g.className="grand";g.innerHTML=`<span>전체 합계</span><strong>${total}잔</strong>`;$("summary").append(g)}
function text(){let{s,total}=aggregate(latest),a=["[최종 커피 주문서]",""];Object.keys(s).sort().forEach(b=>{a.push(`[${b}]`);Object.entries(s[b]).sort((x,z)=>z[1]-x[1]).forEach(([m,q])=>a.push(`${m} ${q}잔`));a.push(`소계 ${Object.values(s[b]).reduce((x,q)=>x+q,0)}잔`,"")});a.push(`전체 합계 ${total}잔`);return a.join("\n")}
async function copy(){if(!latest.length)return alert("복사할 주문이 없습니다.");try{await navigator.clipboard.writeText(text())}catch{let x=document.createElement("textarea");x.value=text();document.body.append(x);x.select();document.execCommand("copy");x.remove()}alert("주문서가 복사되었습니다.")}
async function reset(){if(!confirm("모든 주문을 삭제하시겠습니까?\n삭제한 주문은 복구할 수 없습니다."))return;$("reset").disabled=true;try{let s=await getDocs(collection(db,"orders"));await Promise.all(s.docs.map(x=>deleteDoc(doc(db,"orders",x.id))));alert("전체 주문이 초기화되었습니다.")}catch(e){alert("초기화 실패: Firebase 삭제 권한을 확인해주세요.")}finally{$("reset").disabled=false}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelectorAll(".temp").forEach(x=>x.onclick=()=>{temp=x.dataset.temp;document.querySelectorAll(".temp").forEach(y=>y.classList.toggle("active",y.dataset.temp===temp))});$("add").onclick=custom;$("custom").onkeydown=e=>{if(e.key==="Enter")custom()};$("submit").onclick=submit;$("copy").onclick=copy;$("reset").onclick=reset;onSnapshot(collection(db,"orders"),s=>{latest=s.docs.map(x=>({id:x.id,...x.data()}));drawOrders(latest);drawSummary(latest)},e=>{$("orders").textContent="주문을 불러오지 못했습니다.";$("summary").textContent="집계를 불러오지 못했습니다.";console.error(e)});tabs();menus();drawCart();
</script></body></html>
