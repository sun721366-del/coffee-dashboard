<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>☕ 단체 커피 주문</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
    header{background:#242a31;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}
    header h1{margin:0 0 5px;font-size:21px}
    header p{margin:0;color:#cbd0d5;font-size:13px}
    main{max-width:900px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0000000d}
    label{font-size:13px;font-weight:bold;color:#555}
    .name{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:7px;font-size:16px}
    h2{font-size:18px;margin:0 0 14px}
    .cat{margin-top:18px}.cat:first-child{margin-top:0}.cat-title{font-weight:700;color:#666;margin-bottom:9px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
    .menu{border:1px solid #ddd;background:#fff;border-radius:12px;padding:13px;text-align:left;cursor:pointer}
    .menu:hover{background:#f7f8fa}.menu:active{transform:scale(.98)}
    .menu b{display:block;font-size:15px}.menu small{color:#777}
    .order-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee}
    .order-row:last-child{border-bottom:0}
    .qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eef0f2;width:30px;height:30px;border-radius:8px;font-size:17px;cursor:pointer}
    .total{display:flex;justify-content:space-between;border-top:2px solid #222;padding-top:13px;margin-top:12px;font-size:19px;font-weight:bold}
    .submit{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:#242a31;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
    .submit:disabled,.reset-btn:disabled{background:#999;cursor:not-allowed}
    .empty{text-align:center;color:#999;padding:20px}.status{font-size:12px;color:#777;margin-top:10px}.live{color:#16834a;font-weight:bold}
    .reset-btn{background:#dc3545;color:#fff;border:none;border-radius:8px;padding:10px 15px;cursor:pointer;margin-bottom:15px;font-weight:bold}
    .reset-btn:hover{background:#c82333}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}th{background:#f7f7f7}
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header><h1>☕ 단체 커피 주문</h1><p>이름을 입력하고 메뉴를 선택한 뒤 주문을 제출하세요.</p></header>
  <main>
    <div class="card"><label for="name">주문자 이름</label><input id="name" class="name" placeholder="예: 홍길동"></div>
    <div class="card"><h2>메뉴 선택</h2><div id="menus"></div></div>
    <div class="card">
      <h2>내 주문</h2><div id="cart"></div>
      <div class="total"><span>총 수량</span><span id="total">0잔</span></div>
      <button id="submitButton" class="submit" type="button">주문 제출</button>
      <div class="status" id="status"></div>
    </div>
    <div class="card">
      <h2>현재 주문 현황 <span class="live">● 실시간</span></h2>
      <button id="resetButton" class="reset-btn" type="button">전체 주문 초기화</button>
      <div id="allOrders" class="empty">주문을 불러오는 중...</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-2TW5sR9qhuCgQxwf7ysFhLi1WwCPBT8",
      authDomain: "newjin-coffee-dashboard.firebaseapp.com",
      projectId: "newjin-coffee-dashboard",
      storageBucket: "newjin-coffee-dashboard.firebasestorage.app",
      messagingSenderId: "157316244820",
      appId: "1:157316244820:web:9ca89db007550bd274d4c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const menus = {
      "☕ Coffee":[["아메리카노",4500],["카페라떼",5000],["카푸치노",5000],["바닐라라떼",5500],["카페모카",5500],["카라멜마키아또",5500],["콜드브루",5000],["콜드브루 라떼",5500]],
      "🍵 Non-Coffee":[["녹차라떼",5000],["초코라떼",5000],["밀크티",5000],["고구마라떼",5500]],
      "🧊 Beverage":[["레몬에이드",5500],["자몽에이드",5500],["복숭아 아이스티",4500],["청포도에이드",5500]],
      "🍰 Dessert":[["치즈케이크",6000],["초코케이크",6000],["크루아상",4500],["마카롱",2500]]
    };
    let cart = {};

    const menusEl = document.getElementById("menus");
    const cartEl = document.getElementById("cart");
    const totalEl = document.getElementById("total");
    const statusEl = document.getElementById("status");
    const ordersEl = document.getElementById("allOrders");
    const nameEl = document.getElementById("name");
    const submitBtn = document.getElementById("submitButton");
    const resetBtn = document.getElementById("resetButton");

    function renderMenus(){
      menusEl.innerHTML = "";
      for(const [category,items] of Object.entries(menus)){
        const section = document.createElement("div"); section.className="cat";
        const title = document.createElement("div"); title.className="cat-title"; title.textContent=category;
        const grid = document.createElement("div"); grid.className="grid";
        items.forEach(([name,price])=>{
          const button=document.createElement("button"); button.type="button"; button.className="menu";
          const bold=document.createElement("b"); bold.textContent=name;
          const small=document.createElement("small"); small.textContent=price.toLocaleString()+"원";
          button.append(bold,small);
          button.addEventListener("click",()=>{ if(!cart[name]) cart[name]={price,qty:0}; cart[name].qty++; renderCart(); });
          grid.appendChild(button);
        });
        section.append(title,grid); menusEl.appendChild(section);
      }
    }

    function renderCart(){
      const entries=Object.entries(cart); cartEl.innerHTML="";
      if(!entries.length){ cartEl.innerHTML='<div class="empty">메뉴를 선택하세요.</div>'; }
      else entries.forEach(([name,item])=>{
        const row=document.createElement("div"); row.className="order-row";
        const label=document.createElement("span"); label.textContent=name;
        const qty=document.createElement("span"); qty.className="qty";
        const minus=document.createElement("button"); minus.type="button"; minus.textContent="−";
        minus.addEventListener("click",()=>{ cart[name].qty--; if(cart[name].qty<=0) delete cart[name]; renderCart(); });
        const count=document.createElement("b"); count.textContent=item.qty;
        const plus=document.createElement("button"); plus.type="button"; plus.textContent="+";
        plus.addEventListener("click",()=>{ cart[name].qty++; renderCart(); });
        qty.append(minus,count,plus); row.append(label,qty); cartEl.appendChild(row);
      });
      totalEl.textContent=entries.reduce((sum,[,item])=>sum+item.qty,0)+"잔";
    }

    async function submitOrder(){
      const name=nameEl.value.trim();
      if(!name){ alert("주문자 이름을 입력해주세요."); nameEl.focus(); return; }
      if(!Object.keys(cart).length){ alert("메뉴를 선택해주세요."); return; }
      submitBtn.disabled=true; statusEl.textContent="주문 제출 중...";
      try{
        await addDoc(collection(db,"orders"),{
          name,
          items:Object.entries(cart).map(([menu,v])=>({menu,qty:v.qty,price:v.price})),
          createdAt:new Date()
        });
        cart={}; renderCart(); nameEl.value="";
        statusEl.innerHTML='<span class="live">주문이 접수되었습니다.</span>';
      }catch(error){ console.error(error); statusEl.textContent="주문 저장 실패: Firebase 권한을 확인해주세요."; }
      finally{ submitBtn.disabled=false; }
    }

    function renderOrders(data){
      if(!data.length){ ordersEl.innerHTML='<div class="empty">아직 주문이 없습니다.</div>'; return; }
      const table=document.createElement("table");
      table.innerHTML="<thead><tr><th>주문자</th><th>주문</th><th>수량</th></tr></thead>";
      const body=document.createElement("tbody");
      data.forEach(order=>{
        const items=Array.isArray(order.items)?order.items:[];
        const row=document.createElement("tr");
        const name=document.createElement("td"); name.textContent=order.name||"-";
        const itemCell=document.createElement("td"); itemCell.textContent=items.map(i=>`${i.menu||"메뉴 미상"} ${Number(i.qty)||0}잔`).join(", ")||"-";
        const total=document.createElement("td"); total.textContent=items.reduce((s,i)=>s+(Number(i.qty)||0),0)+"잔";
        row.append(name,itemCell,total); body.appendChild(row);
      });
      table.appendChild(body); ordersEl.innerHTML=""; ordersEl.appendChild(table);
    }

    async function resetOrders(){
      if(!confirm("모든 주문 내역을 삭제하시겠습니까?\n삭제한 주문은 복구할 수 없습니다.")) return;
      resetBtn.disabled=true; resetBtn.textContent="초기화 중...";
      try{
        const snapshot=await getDocs(collection(db,"orders"));
        await Promise.all(snapshot.docs.map(d=>deleteDoc(doc(db,"orders",d.id))));
        alert(snapshot.empty?"초기화할 주문이 없습니다.":"전체 주문이 초기화되었습니다.");
      }catch(error){ console.error(error); alert("초기화 실패: Firebase 삭제 권한을 확인해주세요."); }
      finally{ resetBtn.disabled=false; resetBtn.textContent="전체 주문 초기화"; }
    }

    submitBtn.addEventListener("click",submitOrder);
    resetBtn.addEventListener("click",resetOrders);

    onSnapshot(collection(db,"orders"),snapshot=>{
      renderOrders(snapshot.docs.map(d=>({id:d.id,...d.data()})));
    },error=>{
      console.error(error);
      ordersEl.innerHTML='<div class="empty">주문 현황을 불러오지 못했습니다. Firebase 권한 또는 연결을 확인해주세요.</div>';
    });

    renderMenus();
    renderCart();
  </script>
</body>
</html>
